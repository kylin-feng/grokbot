<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GrokBot</title>
  <meta name="description" content="GrokBot — open-source 1:1 Grok clone. Bring your own xAI API key.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='8'%20fill='%23000'/%3E%3Ctext%20x='16'%20y='22.5'%20font-family='Arial,sans-serif'%20font-size='19'%20font-weight='700'%20fill='%23fff'%20text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- ======================= Sidebar ======================= -->
    <aside id="sidebar">
      <div class="sb-top">
        <span class="wordmark" title="GrokBot — unofficial open-source clone">Grok<span class="wm-sub">bot</span></span>
        <button id="sb-close" class="icon-btn" title="Close sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        </button>
      </div>

      <div class="sb-actions">
        <button id="btn-new" class="sb-item sb-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          <span>New chat</span>
        </button>
        <label class="sb-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
          <input id="chat-search" type="text" placeholder="Search chats" autocomplete="off" spellcheck="false">
        </label>
      </div>

      <div class="sb-label">Recents</div>
      <nav id="chat-list" class="sb-list"></nav>

      <div class="sb-bottom">
        <a class="sb-item" href="https://grok.com" target="_blank" rel="noopener" title="Grok is a trademark of xAI — this is an unofficial clone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          <span>Get SuperGrok</span>
        </a>
        <button id="btn-theme" class="sb-item">
          <span class="theme-ic-sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M6.34 17.66l-1.41 1.41"/><path d="M19.07 4.93l-1.41 1.41"/></svg></span>
          <span class="theme-ic-moon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span>
          <span class="theme-label">Light mode</span>
        </button>
        <button id="btn-settings" class="sb-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          <span>Settings</span>
        </button>
      </div>
    </aside>
    <div id="scrim"></div>

    <!-- ======================= Main ======================= -->
    <main id="main">
      <header id="topbar">
        <button id="sb-open" class="icon-btn" title="Open sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        </button>
        <div class="model-select">
          <button id="model-btn">
            <span id="model-name">Grok 4.1</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div id="model-menu" class="menu hidden"></div>
        </div>
        <div class="top-right">
          <a class="icon-btn" href="https://github.com/kylin-feng/grokbot" target="_blank" rel="noopener" title="GitHub">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55v-2.15c-3.2.69-3.87-1.36-3.87-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.03 1.75 2.69 1.25 3.34.95.1-.74.4-1.25.72-1.54-2.55-.29-5.23-1.28-5.23-5.68 0-1.25.45-2.28 1.18-3.08-.12-.29-.51-1.46.11-3.05 0 0 .96-.31 3.15 1.18a10.9 10.9 0 0 1 5.74 0c2.19-1.49 3.15-1.18 3.15-1.18.62 1.59.23 2.76.11 3.05.73.8 1.18 1.83 1.18 3.08 0 4.41-2.69 5.38-5.25 5.66.41.36.77 1.05.77 2.13v3.16c0 .3.21.67.8.55A11.52 11.52 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>
          </a>
        </div>
      </header>

      <div id="scroll">
        <div id="thread">
          <div id="empty-state">
            <h1>How can I help you today?</h1>
          </div>
        </div>
      </div>

      <div id="composer-wrap">
        <div id="composer">
          <div id="attachments" class="hidden"></div>
          <textarea id="input" rows="1" placeholder="Ask Grok anything…" autocomplete="off" spellcheck="false"></textarea>
          <div class="composer-row">
            <div class="cr-left">
              <button id="btn-attach" class="icon-btn" title="Attach files or images">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
              <button id="btn-think" class="pill" title="Extended reasoning before answering">
                <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 3l1.8 6.2L20 11l-6.2 1.8L12 19l-1.8-6.2L4 11l6.2-1.8L12 3z"/></svg>
                <span>Think</span>
              </button>
              <button id="btn-deep" class="pill" title="Search the web before answering">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="3" y1="12" x2="21" y2="12"/><path d="M12 3a13.5 13.5 0 0 1 3.6 9 13.5 13.5 0 0 1-3.6 9 13.5 13.5 0 0 1-3.6-9A13.5 13.5 0 0 1 12 3z"/></svg>
                <span>DeepSearch</span>
              </button>
              <button id="btn-img" class="pill" title="Generate an image">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-4.5-4.5L6 21"/></svg>
                <span>Create image</span>
              </button>
            </div>
            <div class="cr-right">
              <button id="btn-mic" class="icon-btn" disabled title="Voice input — coming soon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
              </button>
              <button id="btn-send" class="send" disabled title="Send">
                <span class="ic-send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></span>
                <span class="ic-stop"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="7" y="7" width="10" height="10" rx="2"/></svg></span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <input type="file" id="file-input" multiple hidden
         accept="image/*,.txt,.md,.json,.csv,.js,.ts,.py,.html,.css,.xml,.yml,.yaml,.log,.c,.cpp,.java,.go,.rs,.sh,.sql">

  <!-- ======================= Settings modal ======================= -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2>Settings</h2>
        <button id="modal-close" class="icon-btn" title="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span>API key <em>(stored in your browser only)</em></span>
          <div class="key-row">
            <input id="set-key" type="password" placeholder="xai-…" autocomplete="off" spellcheck="false">
            <button id="set-key-eye" class="icon-btn" type="button" title="Show / hide">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </label>
        <label class="field">
          <span>API base URL <em>(any OpenAI-compatible endpoint)</em></span>
          <input id="set-base" type="text" placeholder="https://api.x.ai/v1" autocomplete="off" spellcheck="false">
        </label>
        <label class="field">
          <span>System prompt <em>(optional)</em></span>
          <textarea id="set-sys" rows="3" placeholder="You are Grok…"></textarea>
        </label>
        <label class="field">
          <span>Temperature <em>(empty = provider default)</em></span>
          <input id="set-temp" type="number" min="0" max="2" step="0.1" placeholder="e.g. 0.7">
        </label>
        <div class="modal-actions">
          <button id="btn-test" class="btn ghost">Test connection</button>
          <span id="test-result"></span>
          <span class="spacer"></span>
          <button id="btn-cancel" class="btn ghost">Cancel</button>
          <button id="btn-save" class="btn solid">Save</button>
        </div>
        <p class="modal-note">
          Get an API key at <a href="https://console.x.ai" target="_blank" rel="noopener">console.x.ai</a>.
          No key is ever sent anywhere except the endpoint above (via your own server).
        </p>
      </div>
    </div>
  </div>

  <div id="toast" class="hidden"></div>

  <script src="markdown.js"></script>
  <script src="app.js"></script>
</body>
</html>
